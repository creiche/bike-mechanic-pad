<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#0f172a" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<!-- Hosts that cannot send COOP/COEP headers (GitHub Pages) get them from the service worker
		     (src/service-worker.ts). The first visit is not isolated, so reload once after it takes over. -->
		<script>
			if (!window.crossOriginIsolated && navigator.serviceWorker && !sessionStorage.getItem('coi-reload')) {
				navigator.serviceWorker.ready.then(() => {
					sessionStorage.setItem('coi-reload', '1'); // one try only, never a reload loop
					location.reload();
				});
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
