name: CI

on:
  push:
    branches: [main]
    tags: ['v*'] # pushing a v* tag releases to mechanics' devices, after every check below passes
  pull_request:

jobs:
  # Required: everything that must be green to merge.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --project=android # builds and serves the production build
      - run: npm run build
      # The deploy job ships this exact tested build.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: site
          path: build/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Required. Runs on macOS because in Playwright's Linux WebKit, Atomics.waitAsync loses wake-ups, which stalls
  # sqlite's OPFS proxy so database requests never answer. That is the engine, not the app.
  webkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npx playwright test --project=webkit --project=iphone --project=cross-engine
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-webkit
          path: test-results/
          retention-days: 7

  # Release: only for v* tags, only after both test jobs pass. Cloudflare Pages sends the COOP/COEP headers in
  # static/_headers and gives the app an origin of its own (never a shared yourname.github.io origin).
  # One-time setup: create the project as Direct Upload, never "Connect to Git" (that would publish every push to
  # main without waiting for these tests): npx wrangler pages project create bike-mechanic-pad --production-branch=main
  # Then add the repo secrets CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages Edit) and CLOUDFLARE_ACCOUNT_ID.
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, webkit]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=bike-mechanic-pad --branch=main
