# Temporary: find out why WebRTC finds no network address on the macOS runner. Remove once answered.
name: WebRTC diagnostics

on:
  pull_request:

jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit
      - name: Runner and interfaces
        run: |
          sw_vers; echo "image: $ImageOS $ImageVersion"
          ifconfig | grep -E '^[a-z]|inet '
      - run: node .github/diag/webrtc-diag.mjs
      - name: Local network denials in the system log
        if: always()
        run: |
          log show --last 15m --style compact --predicate 'eventMessage CONTAINS[c] "local network" OR eventMessage CONTAINS[c] "NECP" OR eventMessage CONTAINS[c] "nw_path"' 2>/dev/null \
            | grep -iE 'den(y|ied)|block|local network|unsatisfied' | grep -viE 'mdnsresponder.*cache' | tail -40 || true
